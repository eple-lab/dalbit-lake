<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>달빛 호수</title>
<style>
  html, body {
    margin: 0; min-height: 100%;
    background: #070b1a; color: #e8ecff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
  main {
    position: relative; z-index: 1; min-height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; text-align: center;
  }
  h1 {
    font-size: clamp(44px, 10vw, 80px); margin: 0 0 8px; font-weight: 300;
    letter-spacing: .15em; text-shadow: 0 0 28px #b9ccff;
  }
  .sub { margin: 0 0 40px; opacity: .75; line-height: 1.7; }
  .games { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 720px; }
  .game {
    flex: 1 1 260px; max-width: 340px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 28px 20px; border-radius: 24px; text-decoration: none; color: inherit;
    border: 1px solid rgba(185, 204, 255, .45);
    background: rgba(12, 18, 44, .6); backdrop-filter: blur(4px);
    box-shadow: 0 0 24px rgba(185, 204, 255, .15);
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  a.game:hover, a.game:focus-visible {
    transform: translateY(-4px); background: rgba(30, 40, 90, .65);
    box-shadow: 0 0 36px rgba(185, 204, 255, .35); outline: none;
  }
  .game .icon { font-size: 44px; filter: drop-shadow(0 0 10px rgba(255, 230, 140, .6)); }
  .game h2 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: .05em; }
  .game p { margin: 0; font-size: 14px; opacity: .75; line-height: 1.6; }
  .game .go {
    margin-top: 10px; padding: 8px 24px; border-radius: 999px;
    border: 1px solid #b9ccff; background: rgba(185, 204, 255, .12); font-size: 15px;
  }
  .game.soon { opacity: .6; cursor: default; }
  .game.soon .go { border-style: dashed; }
  footer { position: relative; z-index: 1; text-align: center; padding: 0 16px 20px; font-size: 12px; opacity: .45; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <h1>달빛 호수</h1>
  <p class="sub">달빛이 내려앉은 호수에서 즐기는 작은 게임들</p>
  <div class="games">
    <a class="game" href="starlight/">
      <span class="icon">🌟</span>
      <h2>별빛 받기</h2>
      <p>호수 위 작은 배로 떨어지는 별빛을 담아요.<br>그림자 방울은 피하세요.</p>
      <span class="go">플레이</span>
    </a>
    <div class="game soon" aria-disabled="true">
      <span class="icon">🧚</span>
      <h2>반딧불이 모으기</h2>
      <p>작은 요정이 되어 여름밤 숲을 날며<br>반딧불이 5마리를 병에 담아요.</p>
      <span class="go">준비 중</span>
    </div>
  </div>
</main>
<footer>eple-lab · dalbit-lake</footer>
<script>
// quiet background: twinkling stars, moon, and its reflection on the lake
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H, horizon, stars = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  horizon = H * 0.62;
  stars = Array.from({ length: Math.floor(W * horizon / 2200) }, () => ({
    x: Math.random() * W, y: Math.random() * horizon,
    r: Math.random() * 1.3 + 0.3, p: Math.random() * Math.PI * 2,
  }));
}

function draw(now) {
  const t = now / 1000;
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#050817');
  sky.addColorStop(1, '#232b5c');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizon);

  ctx.fillStyle = '#dfe7ff';
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + Math.sin(t * 1.4 + s.p) * 0.3;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  const mx = W * 0.8, my = horizon * 0.25, mr = Math.max(26, Math.min(W, H) * 0.06);
  const glow = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 5);
  glow.addColorStop(0, 'rgba(220,230,255,.3)');
  glow.addColorStop(1, 'rgba(220,230,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, horizon);
  ctx.fillStyle = '#f4f2e6';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

  const water = ctx.createLinearGradient(0, horizon, 0, H);
  water.addColorStop(0, '#1d2552');
  water.addColorStop(1, '#04060f');
  ctx.fillStyle = water;
  ctx.fillRect(0, horizon, W, H - horizon);

  ctx.fillStyle = '#e8ecff';
  for (let y = horizon + 2; y < H; y += 4) {
    const k = (y - horizon) / (H - horizon);
    const w = mr * (0.6 + k * 2) * (0.6 + 0.4 * Math.sin(t * 2 + y * 0.09));
    ctx.globalAlpha = 0.5 * (1 - k * 0.8) * (0.5 + 0.5 * Math.sin(t * 3 + y * 0.3));
    ctx.fillRect(mx - w / 2 + Math.sin(t * 1.3 + y * 0.05) * 6, y, w, 1.5);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
