<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>별빛 받기 · 달빛 호수</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #070b1a; color: #e8ecff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 12px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; font-size: 18px; text-shadow: 0 0 8px #8fb4ff;
  }
  #hud .group { display: flex; align-items: center; gap: 16px; }
  #time { opacity: .75; font-variant-numeric: tabular-nums; }
  #combo { opacity: 0; transition: opacity .2s; color: #ffe9a8; }
  #lives { letter-spacing: 4px; }
  #stop {
    pointer-events: auto; padding: 6px 14px; font-size: 14px; font-family: inherit;
    border-radius: 999px; border: 1px solid rgba(185, 204, 255, .6); color: #e8ecff; cursor: pointer;
    background: rgba(10, 14, 32, .55);
  }
  #stop:hover { background: rgba(185, 204, 255, .2); }
  #stop.hidden { display: none; }
  #overlay {
    position: fixed; inset: 0; padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: rgba(5, 8, 20, .5);
  }
  #overlay.hidden { display: none; }
  h1 {
    font-size: clamp(40px, 9vw, 72px); margin: 0 0 12px; font-weight: 300;
    letter-spacing: .15em; text-shadow: 0 0 28px #b9ccff;
  }
  #overlay p { margin: 4px 0; opacity: .85; line-height: 1.7; }
  #result { font-size: 22px; margin-bottom: 8px !important; color: #ffe9a8; opacity: 1 !important; }
  #overlay button {
    margin-top: 24px; padding: 12px 36px; font-size: 18px; font-family: inherit;
    border-radius: 999px; border: 1px solid #b9ccff; color: #fff; cursor: pointer;
    background: rgba(185, 204, 255, .12); box-shadow: 0 0 20px rgba(185, 204, 255, .25);
  }
  #overlay button:hover { background: rgba(185, 204, 255, .25); }
  #home { margin-top: 16px; color: #b9ccff; font-size: 14px; text-decoration: none; opacity: .75; }
  #home:hover { opacity: 1; text-decoration: underline; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span class="group"><span id="score">별빛 0</span><span id="time">⏱ 00:00</span></span>
  <span id="combo"></span>
  <span class="group"><span id="lives"></span><button id="stop" class="hidden">그만하기</button></span>
</div>
<div id="overlay">
  <h1>별빛 받기</h1>
  <p id="result"></p>
  <p>호수 위의 작은 배를 움직여 떨어지는 <b>별빛</b>을 담으세요.</p>
  <p>황금 별은 5배, 연속으로 담으면 점수가 커집니다.</p>
  <p>보랏빛 <b>그림자 방울</b>에 닿으면 달이 하나 기웁니다.</p>
  <p style="font-size:14px;opacity:.6">← → / A D 키, 또는 마우스·터치로 이동 · Esc 또는 그만하기 버튼으로 처음 화면</p>
  <button id="start">시작하기</button>
  <a id="home" href="../">← 메인으로</a>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $score = document.getElementById('score');
const $combo = document.getElementById('combo');
const $lives = document.getElementById('lives');
const $overlay = document.getElementById('overlay');
const $result = document.getElementById('result');
const $start = document.getElementById('start');
const $time = document.getElementById('time');
const $stop = document.getElementById('stop');

let W, H, S, horizon;
let bgStars = [], mountains = [], fireflies = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W, H) / 700;
  horizon = H * 0.56;

  bgStars = Array.from({ length: Math.floor(W * horizon / 2500) }, () => ({
    x: Math.random() * W, y: Math.random() * horizon * 0.95,
    r: Math.random() * 1.3 + 0.3, p: Math.random() * Math.PI * 2,
  }));
  mountains = [];
  for (let layer = 0; layer < 2; layer++) {
    const pts = [];
    const seed = Math.random() * 100;
    for (let x = 0; x <= W + 20; x += 20) {
      const h = (Math.sin(x * 0.004 + seed) * 0.5 + Math.sin(x * 0.011 + seed * 2) * 0.3 + 0.9)
        * H * (layer ? 0.05 : 0.09);
      pts.push([x, horizon - h]);
    }
    mountains.push(pts);
  }
  fireflies = Array.from({ length: 14 }, () => ({
    x: Math.random() * W, y: horizon - Math.random() * H * 0.12,
    p: Math.random() * 10, s: Math.random() * 0.5 + 0.5,
  }));
  if (boat) {
    boat.y = H * 0.8;
    boat.w = Math.max(64, 100 * S);
    boat.x = Math.min(Math.max(boat.x, boat.w / 2), W - boat.w / 2);
  }
}

// ---------- state ----------
let boat = null;
let items = [], ripples = [], particles = [], texts = [], flashes = [], shower = [];
let score = 0, lives = 3, combo = 0, elapsed = 0, spawnTimer = 0, shake = 0;
let running = false, last = 0, t = 0;
let ending = false, endTimer = 0, showerTimer = 0, skyFlash = 0, shownSecond = -1;
let best = 0;
try { best = +localStorage.getItem('dalbit-lake-best') || 0; } catch (e) {}

const keys = {};
let pointerX = null;

function reset() {
  boat = { x: W / 2, y: H * 0.8, w: Math.max(64, 100 * S), vx: 0, glow: 0 };
  items = []; ripples = []; particles = []; texts = []; flashes = []; shower = [];
  score = 0; lives = 3; combo = 0; elapsed = 0; spawnTimer = 0.6; shake = 0;
  ending = false; showerTimer = 0; skyFlash = 0;
  pointerX = null;
  updateHud();
  updateTime();
}

function updateTime() {
  const sec = Math.floor(elapsed);
  if (sec === shownSecond) return;
  shownSecond = sec;
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  $time.textContent = `⏱ ${mm}:${ss}`;
}

function updateHud() {
  $score.textContent = `별빛 ${score}`;
  $lives.textContent = '🌕'.repeat(lives) + '🌑'.repeat(3 - lives);
  const mult = multiplier();
  $combo.textContent = combo >= 3 ? `${combo} 연속 · ×${mult}` : '';
  $combo.style.opacity = combo >= 3 ? 1 : 0;
}

const multiplier = () => 1 + Math.floor(combo / 5);

// ---------- spawning ----------
function spawn() {
  const r = Math.random();
  const darkChance = Math.min(0.14 + elapsed * 0.004, 0.34);
  const type = r < darkChance ? 'dark' : r < darkChance + 0.12 ? 'gold' : 'star';
  const size = (type === 'gold' ? 15 : type === 'dark' ? 14 : 11) * Math.max(S, 0.7);
  const speed = (110 + Math.min(elapsed * 3.5, 200) + Math.random() * 60) * Math.max(H / 800, 0.7);
  items.push({
    type, r: size,
    x: size + Math.random() * (W - size * 2), y: -20,
    vy: type === 'gold' ? speed * 1.25 : speed,
    sway: (type === 'gold' ? 40 + Math.random() * 30 : Math.random() * 30) * S,
    phase: Math.random() * Math.PI * 2,
    rot: Math.random() * Math.PI, landY: boat.y + 30 + Math.random() * (H - boat.y - 40),
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (Math.random() * 160 + 40) * S;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 * S, life: 1, color });
  }
}

// "화악~" — light ring, glow, and sparkles that bloom outward and float up
function bloom(x, y, gold) {
  flashes.push({ x, y, life: 1, gold, max: (gold ? 190 : 120) * Math.max(S, 0.7) });
  const n = gold ? 46 : 26;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (Math.random() * 260 + 120) * S;
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80 * S,
      life: 1, spark: true, size: (Math.random() * 3 + 2.5) * Math.max(S, 0.7),
      color: gold ? (Math.random() < 0.5 ? '#fff1a0' : '#d9ff8a') : (Math.random() < 0.5 ? '#ffffff' : '#b9d0ff'),
    });
  }
  boat.glow = 1;
  if (gold) skyFlash = 1;
}

// ---------- update ----------
function update(dt) {
  elapsed += dt;

  // boat movement
  const maxV = 620 * Math.max(S, 0.8);
  let dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  if (dir) pointerX = null;
  if (pointerX !== null) {
    const diff = pointerX - boat.x;
    boat.vx = Math.max(-maxV * 1.4, Math.min(maxV * 1.4, diff * 12));
  } else {
    boat.vx += (dir * maxV - boat.vx) * Math.min(1, dt * 10);
  }
  boat.x += boat.vx * dt;
  boat.x = Math.min(Math.max(boat.x, boat.w / 2), W - boat.w / 2);
  if (Math.abs(boat.vx) > 80 && Math.random() < dt * 12) {
    ripples.push({ x: boat.x - Math.sign(boat.vx) * boat.w * 0.45, y: boat.y + 6, r: 4, life: 1, dark: false });
  }

  // spawn
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawn();
    spawnTimer = Math.max(0.32, 0.9 - elapsed * 0.009) * (0.7 + Math.random() * 0.6);
  }

  // items
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    it.phase += dt * 2;
    it.rot += dt * (it.type === 'dark' ? 1 : 2);
    const ix = it.x + Math.sin(it.phase) * it.sway;
    if (it.type === 'gold' && Math.random() < dt * 18) {
      particles.push({
        x: ix + (Math.random() - 0.5) * it.r, y: it.y + (Math.random() - 0.5) * it.r,
        vx: (Math.random() - 0.5) * 30 * S, vy: -20 * S, life: 0.7, spark: true,
        size: (Math.random() * 1.5 + 1.5) * Math.max(S, 0.7), color: Math.random() < 0.5 ? '#fff1a0' : '#d9ff8a',
      });
    }

    const hitY = it.y > boat.y - boat.w * 0.35 - it.r && it.y < boat.y + 10;
    if (hitY && Math.abs(ix - boat.x) < boat.w / 2 + it.r * 0.6 && it.y < boat.y + 10) {
      items.splice(i, 1);
      if (it.type === 'dark') {
        lives--; combo = 0;
        burst(ix, it.y, '#9b6bff', 22);
        if (lives <= 0) { updateHud(); gameOver(); return; }
        shake = 14 * S;
        texts.push({ x: ix, y: it.y - 20, s: '달이 기울었어요', life: 1, color: '#c9a6ff' });
      } else {
        combo++;
        const gold = it.type === 'gold';
        const gain = (gold ? 5 : 1) * multiplier();
        score += gain;
        bloom(ix, it.y, gold);
        texts.push({ x: ix, y: it.y - 20, s: `+${gain}`, life: 1, color: gold ? '#ffd76a' : '#e3ecff', big: gold });
      }
      updateHud();
      continue;
    }
    if (it.y >= it.landY && it.y > boat.y + 10) {
      items.splice(i, 1);
      ripples.push({ x: ix, y: it.landY, r: 3, life: 1, dark: it.type === 'dark' });
      if (it.type !== 'dark') {
        ripples.push({ x: ix, y: it.landY, r: 0, life: 1.3, dark: false });
        if (combo) { combo = 0; updateHud(); }
      }
    }
  }

  updateTime();
}

// effects keep animating on the title screen and during the ending shower
function updateEffects(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += 46 * S * dt; rp.life -= dt * 0.8;
    if (rp.life <= 0) ripples.splice(i, 1);
  }
  const drag = Math.pow(0.04, dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.spark) { p.vx *= drag; p.vy = p.vy * drag - 30 * S * dt; p.life -= dt * 0.9; }
    else { p.vy += 260 * S * dt; p.life -= dt * 1.4; }
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const tx = texts[i];
    tx.y -= 40 * dt; tx.life -= dt * 1.1;
    if (tx.life <= 0) texts.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].life -= dt * 1.5;
    if (flashes[i].life <= 0) flashes.splice(i, 1);
  }

  // ending: stars pour down from the sky
  if (showerTimer > 0) {
    showerTimer -= dt;
    const rate = showerTimer > 1 ? 90 : 90 * showerTimer;
    let n = rate * dt;
    while (n > 0) {
      if (Math.random() < n) spawnShowerStar();
      n--;
    }
  }
  for (let i = shower.length - 1; i >= 0; i--) {
    const s = shower[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y > H + 60 || s.x < -100) shower.splice(i, 1);
  }

  if (boat) boat.glow = Math.max(0, boat.glow - dt * 1.5);
  skyFlash = Math.max(0, skyFlash - dt * 1.8);
  shake = Math.max(0, shake - dt * 40);

  if (ending) {
    endTimer -= dt;
    if (endTimer <= 0) { ending = false; showResult(); }
  }
}

function spawnShowerStar() {
  const v = (500 + Math.random() * 500) * Math.max(H / 800, 0.7);
  const a = Math.PI / 2 + 0.35 + Math.random() * 0.15;
  const hue = Math.random();
  shower.push({
    x: Math.random() * (W + 300), y: -40 - Math.random() * 120,
    vx: Math.cos(a) * v, vy: Math.sin(a) * v,
    len: (60 + Math.random() * 120) * Math.max(S, 0.7),
    size: (Math.random() * 2 + 1.5) * Math.max(S, 0.7),
    color: hue < 0.2 ? '255,226,138' : hue < 0.35 ? '217,255,138' : hue < 0.65 ? '185,208,255' : '255,255,255',
  });
}

// ---------- draw ----------
function moonPos() {
  return { x: W * 0.72, y: horizon * 0.32, r: Math.max(28, 52 * S) };
}

function drawStarShape(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#050817');
  sky.addColorStop(0.6, '#111a3d');
  sky.addColorStop(1, '#2a3266');
  ctx.fillStyle = sky;
  ctx.fillRect(-20, -20, W + 40, horizon + 20);

  for (const s of bgStars) {
    ctx.globalAlpha = 0.4 + Math.sin(t * 1.5 + s.p) * 0.35;
    ctx.fillStyle = '#dfe7ff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  // moon — glows brighter with combo
  const m = moonPos();
  const glowBoost = Math.min(combo, 20) / 20;
  const glow = ctx.createRadialGradient(m.x, m.y, m.r * 0.8, m.x, m.y, m.r * (4 + glowBoost * 2));
  glow.addColorStop(0, `rgba(220,230,255,${0.35 + glowBoost * 0.25})`);
  glow.addColorStop(1, 'rgba(220,230,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, horizon);
  ctx.fillStyle = '#f4f2e6';
  ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(180,180,170,.25)';
  for (const [dx, dy, rr] of [[-0.3, -0.2, 0.22], [0.25, 0.15, 0.16], [-0.05, 0.4, 0.12], [0.35, -0.35, 0.09]]) {
    ctx.beginPath(); ctx.arc(m.x + dx * m.r, m.y + dy * m.r, rr * m.r, 0, Math.PI * 2); ctx.fill();
  }

  // mountains
  ['#141a38', '#0b1029'].forEach((col, li) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, horizon);
    for (const [x, y] of mountains[li]) ctx.lineTo(x, y);
    ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();
  });

  // fireflies over the shore
  for (const f of fireflies) {
    const fx = f.x + Math.sin(t * 0.5 * f.s + f.p) * 30;
    const fy = f.y + Math.cos(t * 0.7 * f.s + f.p) * 10;
    ctx.globalAlpha = 0.3 + Math.max(0, Math.sin(t * 2 * f.s + f.p)) * 0.7;
    ctx.fillStyle = '#d8ff9a';
    ctx.beginPath(); ctx.arc(fx, fy, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // water
  const water = ctx.createLinearGradient(0, horizon, 0, H);
  water.addColorStop(0, '#1d2552');
  water.addColorStop(1, '#04060f');
  ctx.fillStyle = water;
  ctx.fillRect(-20, horizon, W + 40, H - horizon + 20);

  // mountain reflection
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#0b1029';
  ctx.beginPath(); ctx.moveTo(0, horizon);
  for (const [x, y] of mountains[1]) ctx.lineTo(x, horizon + (horizon - y) * 0.7);
  ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // moon reflection: shimmering streaks
  for (let y = horizon + 2; y < H; y += 4) {
    const k = (y - horizon) / (H - horizon);
    const w = m.r * (0.6 + k * 2.2) * (0.6 + 0.4 * Math.sin(t * 2.2 + y * 0.09));
    const off = Math.sin(t * 1.3 + y * 0.05) * 6 * (1 + k * 2);
    ctx.globalAlpha = (0.55 + glowBoost * 0.3) * (1 - k * 0.75) * (0.5 + 0.5 * Math.sin(t * 3 + y * 0.3));
    ctx.fillStyle = '#e8ecff';
    ctx.fillRect(m.x - w / 2 + off, y, w, 1.6);
  }
  ctx.globalAlpha = 1;

  // ripples
  ctx.lineWidth = 1.2;
  for (const rp of ripples) {
    ctx.strokeStyle = rp.dark ? `rgba(160,110,255,${rp.life * 0.6})` : `rgba(210,225,255,${rp.life * 0.6})`;
    ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
  }

  if (boat) {
    // falling items
    for (const it of items) {
      const ix = it.x + Math.sin(it.phase) * it.sway;
      if (it.type === 'dark') {
        const g = ctx.createRadialGradient(ix, it.y, 0, ix, it.y, it.r * 2.2);
        g.addColorStop(0, 'rgba(40,10,70,1)');
        g.addColorStop(0.45, 'rgba(90,40,160,.85)');
        g.addColorStop(1, 'rgba(120,60,220,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ix, it.y, it.r * 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#12061f';
        ctx.beginPath(); ctx.arc(ix, it.y, it.r * 0.7, 0, Math.PI * 2); ctx.fill();
      } else if (it.type === 'gold') {
        // firefly-like: breathes bigger and smaller, glow flickers
        const pulse = 0.7 + 0.45 * (0.5 + 0.5 * Math.sin(t * 5.5 + it.phase * 2));
        const flick = 0.75 + 0.25 * Math.sin(t * 17 + it.phase * 5);
        const gr = it.r * 3.4 * pulse;
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(ix, it.y, 0, ix, it.y, gr);
        g.addColorStop(0, `rgba(255,245,170,${0.9 * flick})`);
        g.addColorStop(0.3, `rgba(230,255,130,${0.45 * flick})`);
        g.addColorStop(1, 'rgba(200,255,100,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ix, it.y, gr, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = 22 * pulse; ctx.shadowColor = '#ffe76a';
        ctx.fillStyle = '#fff6c2';
        drawStarShape(ix, it.y, it.r * pulse, it.rot);
        ctx.shadowBlur = 0;
      } else {
        ctx.shadowBlur = 18; ctx.shadowColor = '#a9c4ff';
        ctx.fillStyle = '#eef3ff';
        drawStarShape(ix, it.y, it.r, it.rot);
        ctx.shadowBlur = 0;
        // faint trail
        ctx.globalAlpha = 0.25;
        ctx.fillRect(ix - 0.75, it.y - it.r * 4, 1.5, it.r * 3);
        ctx.globalAlpha = 1;
      }
    }

    drawBoat();
  }

  ctx.globalCompositeOperation = 'lighter';

  // catch bloom: soft glow + expanding light ring
  for (const f of flashes) {
    const k = 1 - f.life, e = 1 - Math.pow(1 - k, 3);
    const rr = f.max * (0.2 + e);
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rr);
    const c = f.gold ? '255,230,140' : '200,220,255';
    g.addColorStop(0, `rgba(${c},${0.55 * f.life})`);
    g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, rr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(${c},${0.8 * f.life})`;
    ctx.lineWidth = 3 * f.life + 0.5;
    ctx.beginPath(); ctx.arc(f.x, f.y, rr * 0.8, 0, Math.PI * 2); ctx.stroke();
    // vertical beam of light rising from the boat
    ctx.fillStyle = `rgba(${c},${0.18 * f.life})`;
    const bw = f.max * 0.25 * f.life;
    ctx.fillRect(f.x - bw / 2, 0, bw, f.y);
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    if (p.spark) {
      const s = p.size * (0.6 + 0.4 * p.life);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - s * 2); ctx.lineTo(p.x + s * 0.4, p.y - s * 0.4);
      ctx.lineTo(p.x + s * 2, p.y); ctx.lineTo(p.x + s * 0.4, p.y + s * 0.4);
      ctx.lineTo(p.x, p.y + s * 2); ctx.lineTo(p.x - s * 0.4, p.y + s * 0.4);
      ctx.lineTo(p.x - s * 2, p.y); ctx.lineTo(p.x - s * 0.4, p.y - s * 0.4);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
  }
  ctx.globalAlpha = 1;

  // ending star shower
  for (const s of shower) {
    const sp = Math.hypot(s.vx, s.vy);
    const tx = s.x - s.vx / sp * s.len, ty = s.y - s.vy / sp * s.len;
    const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
    g.addColorStop(0, `rgba(${s.color},0.95)`);
    g.addColorStop(1, `rgba(${s.color},0)`);
    ctx.strokeStyle = g;
    ctx.lineWidth = s.size;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = `rgba(${s.color},1)`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * 1.3, 0, Math.PI * 2); ctx.fill();
  }

  if (skyFlash > 0) {
    ctx.fillStyle = `rgba(255,240,180,${0.12 * skyFlash})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center';
  for (const tx of texts) {
    ctx.globalAlpha = Math.max(0, tx.life);
    ctx.fillStyle = tx.color;
    const fs = Math.max(14, 20 * S) * (tx.big ? 1.6 : 1) * (1 + 0.3 * Math.max(0, tx.life - 0.7));
    ctx.font = `bold ${fs}px "Malgun Gothic", sans-serif`;
    ctx.fillText(tx.s, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawBoat() {
  const { x, w } = boat;
  const y = boat.y + Math.sin(t * 2.4) * 2;
  const h = w * 0.22;
  const tilt = Math.max(-0.12, Math.min(0.12, boat.vx / 5000));

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);

  // lantern light on water
  const lx = w * 0.22, ly = -h * 2.4;
  const pool = ctx.createRadialGradient(0, h * 0.6, 0, 0, h * 0.6, w * 1.1);
  pool.addColorStop(0, 'rgba(255,200,120,.22)');
  pool.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = pool;
  ctx.beginPath(); ctx.ellipse(0, h * 0.6, w * 1.1, w * 0.3, 0, 0, Math.PI * 2); ctx.fill();

  // hull
  ctx.fillStyle = '#2b2140';
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h * 0.4);
  ctx.quadraticCurveTo(-w * 0.35, h, 0, h);
  ctx.quadraticCurveTo(w * 0.35, h, w / 2, -h * 0.4);
  ctx.quadraticCurveTo(0, h * 0.1, -w / 2, -h * 0.4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(220,230,255,.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h * 0.4);
  ctx.quadraticCurveTo(0, h * 0.1, w / 2, -h * 0.4);
  ctx.stroke();

  // pole + lantern
  ctx.strokeStyle = '#4a3b5e';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lx, -h * 0.1); ctx.lineTo(lx, ly - h * 0.6); ctx.stroke();
  const flicker = (0.85 + Math.sin(t * 9) * 0.08 + Math.sin(t * 13.7) * 0.05) * (1 + boat.glow * 0.9);
  const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, h * 3.2 * flicker);
  lg.addColorStop(0, 'rgba(255,214,140,.75)');
  lg.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.arc(lx, ly, h * 3.2 * flicker, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd88c';
  ctx.beginPath(); ctx.ellipse(lx, ly, h * 0.38, h * 0.5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // reflection of the lantern
  ctx.globalAlpha = 0.25 * flicker;
  ctx.fillStyle = '#ffcf80';
  for (let i = 0; i < 5; i++) {
    const yy = y + h * 1.4 + i * 5;
    const ww = (w * 0.18) * (1 - i * 0.15) * (0.7 + 0.3 * Math.sin(t * 4 + i));
    ctx.fillRect(x + lx - ww / 2, yy, ww, 1.5);
  }
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  t += dt;
  if (running) update(dt);
  updateEffects(dt);
  draw();
  requestAnimationFrame(frame);
}

function start() {
  reset();
  running = true;
  $overlay.classList.add('hidden');
  $stop.classList.remove('hidden');
}

// 그만하기: back to the title screen without a result
function stopGame() {
  if (!running && !ending) return;
  running = false; ending = false; showerTimer = 0;
  boat = null; items = []; shower = []; flashes = []; particles = []; texts = [];
  combo = 0; shake = 0; skyFlash = 0;
  $stop.classList.add('hidden');
  $result.innerHTML = best ? `<span style="font-size:15px;opacity:.7">최고 기록 ${best}</span>` : '';
  $start.textContent = '시작하기';
  $overlay.classList.remove('hidden');
}

function gameOver() {
  running = false;
  ending = true;
  endTimer = 2.6;
  showerTimer = 3.2;
  for (const it of items) burst(it.x + Math.sin(it.phase) * it.sway, it.y, '#cfe0ff', 4);
  items = [];
  $stop.classList.add('hidden');
  texts.push({ x: W / 2, y: H * 0.4, s: '달이 모두 기울었어요', life: 2.2, color: '#e8ecff', big: true });
}

function showResult() {
  const isBest = score > best;
  if (isBest) {
    best = score;
    try { localStorage.setItem('dalbit-lake-best', String(best)); } catch (e) {}
  }
  updateHud();
  $result.innerHTML = `별빛 <b>${score}</b>개를 담았어요${isBest ? ' · 새 기록!' : ''}<br><span style="font-size:15px;opacity:.7">최고 기록 ${best}</span>`;
  $start.textContent = '다시 하기';
  $overlay.classList.remove('hidden');
}

// ---------- input ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'Enter') && !running && !ending) { e.preventDefault(); start(); }
  if (e.code === 'Escape' && running) stopGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('pointerdown', e => { pointerX = e.clientX; });
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || e.buttons) pointerX = e.clientX;
});
canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointerX = null; });
$start.addEventListener('click', start);
$stop.addEventListener('click', stopGame);
addEventListener('resize', resize);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

if (best) $result.innerHTML = `<span style="font-size:15px;opacity:.7">최고 기록 ${best}</span>`;
resize();
updateHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
